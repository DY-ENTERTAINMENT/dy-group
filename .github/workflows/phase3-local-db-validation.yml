name: Validate Phase 3 in Isolated Local Supabase

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VALIDATE-PHASE3-LOCAL-DB to run the disposable local database test"
        required: true
        type: string
      target_ref:
        description: "Approved isolated Phase 3 test branch"
        required: true
        default: "codex/phase3c-server-gate"
        type: string

permissions:
  contents: read

concurrency:
  group: phase3-local-db-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Replay migrations and validate Phase 3 locally
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require explicit local-validation confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "VALIDATE-PHASE3-LOCAL-DB" || {
            echo "Confirmation did not match; no local database was started."
            exit 1
          }

      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Require approved isolated Phase 3 ref
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            codex/phase3-isolated-db-validation|codex/phase3c-server-gate) ;;
            *)
            echo "Refusing to run Phase 3 database validation against an unapproved ref: $TARGET_REF"
            exit 1
            ;;
          esac
          echo "Validated isolated ref: $TARGET_REF at $(git rev-parse HEAD)"

      - name: Set up Node.js for the local-only test harness
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js uses the platform WebSocket implementation
          # during the local integration tests. Node 22 provides it natively.
          node-version: 22
          cache: npm

      - name: Require Node.js 22 with native WebSocket
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          case "$node_version" in
            v22.*) ;;
            *) echo "Phase 3 local database validation requires Node.js 22; found $node_version"; exit 1 ;;
          esac
          node -e 'if (typeof WebSocket !== "function") { throw new Error("Native WebSocket is unavailable") }'

      - name: Install repository test dependencies
        run: npm ci

      - name: Verify disposable Docker runtime
        run: |
          set -euo pipefail
          docker version

      - name: Create isolated Supabase work directory
        id: local
        run: |
          set -euo pipefail
          test ! -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Production Supabase token must not be present."; exit 1; }
          test ! -n "${SUPABASE_PROJECT_REF:-}" || { echo "Production project ref must not be present."; exit 1; }
          test ! -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Production database password must not be present."; exit 1; }
          ci_dir="$RUNNER_TEMP/phase3-local-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ci_dir"
          cp -R "$GITHUB_WORKSPACE/supabase" "$ci_dir/supabase"
          node "$GITHUB_WORKSPACE/scripts/restore-phase3-ci-historical-migrations.mjs" \
            "$ci_dir/supabase/migrations"
          for migration in \
            202610020002_outgoing_requests_phase3a.sql \
            202610030001_outgoing_events_phase3b.sql \
            202610050001_outgoing_feature_server_gate.sql; do
            test -s "$ci_dir/supabase/migrations/$migration" || {
              echo "Selected ref does not contain required Phase 3 migration: $migration"
              exit 1
            }
          done
          test -s "$GITHUB_WORKSPACE/scripts/test-phase3-local-db.mjs" || {
            echo "Selected ref does not contain the Phase 3 database integration suite."
            exit 1
          }
          python3 - "$ci_dir/supabase/config.toml" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          source, count = re.subn(r'^project_id\s*=\s*"[^"]*"', 'project_id = "dy-group-phase3-ci"', source, count=1, flags=re.M)
          if count != 1:
              raise SystemExit('Unable to create an isolated local project identifier.')
          path.write_text(source)
          PY
          python3 - "$ci_dir/supabase/migrations" <<'PY'
          from pathlib import Path
          import sys

          migrations = Path(sys.argv[1])
          dependency = migrations / '202606190003_authorized_regions_default_employee_region.sql'
          target = migrations / '202606190005_force_replace_current_user_has_permission.sql'
          canonical = migrations / '202608110001_version_current_user_can_access_region.sql'

          for path in (dependency, target, canonical):
              if not path.is_file():
                  raise SystemExit(f'Required migration is missing from the CI-only copy: {path.name}')
          if not (dependency.name < target.name < canonical.name):
              raise SystemExit('Unexpected migration ordering; refusing to inject the CI-only bootstrap.')

          dependency_source = dependency.read_text()
          canonical_source = canonical.read_text()
          target_source = target.read_text()
          if 'create or replace function public.current_user_authorized_region_ids()' not in dependency_source:
              raise SystemExit('The region-access dependency is not created by the expected prior migration.')
          if 'create or replace function public.current_user_can_access_region(region_id uuid)' not in canonical_source:
              raise SystemExit('The canonical region-access function definition is not available.')
          if 'public.current_user_authorized_region_ids()' not in canonical_source:
              raise SystemExit('The canonical function no longer uses the expected authorization helper.')
          if 'create policy "Registration viewers can read scoped pending profiles"' not in target_source:
              raise SystemExit('The expected early RLS policy migration has changed; refusing CI bootstrap injection.')

          target.write_text(
              '-- CI-only bootstrap: this temporary copy restores the pre-existing Production helper\n'
              '-- that was first versioned in 202608110001. It is not a repository migration.\n\n'
              + canonical_source
              + '\n\n-- Original 202606190005 migration follows unchanged below.\n\n'
              + target_source
          )
          PY
          printf 'ci_dir=%s\n' "$ci_dir" >> "$GITHUB_OUTPUT"

      - name: Start and reset only the local Supabase stack
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
          CI_DIR: ${{ steps.local.outputs.ci_dir }}
        run: |
          set -euo pipefail
          cd "$CI_DIR"
          # Hosted runners occasionally hit a transient container-registry pull
          # limit while downloading the disposable local stack. Retry only that
          # infrastructure failure; migration and application failures still
          # stop immediately and are never retried or masked.
          for attempt in 1 2 3; do
            if start_output="$(npx --yes supabase@2.117.0 start 2>&1)"; then
              printf '%s\n' "$start_output"
              break
            fi
            printf '%s\n' "$start_output"
            if ! printf '%s\n' "$start_output" | grep -qiE 'toomanyrequests|rate exceeded'; then
              exit 1
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Local Supabase image pulls remained rate-limited after three attempts."
              exit 1
            fi
            npx --yes supabase@2.117.0 stop --no-backup || true
            echo "Transient image-pull rate limit; retrying isolated local stack startup in 30 seconds (attempt $((attempt + 1))/3)."
            sleep 30
          done
          npx --yes supabase@2.117.0 db reset --local
          npx --yes supabase@2.117.0 status -o env > "$RUNNER_TEMP/phase3-local-supabase.env"

      - name: Run Phase 3 local database integration tests
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/phase3-local-supabase.env"
          set +a
          API_URL="$API_URL" ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node scripts/test-phase3-local-db.mjs

      - name: Stop disposable local Supabase stack
        if: always()
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
          CI_DIR: ${{ steps.local.outputs.ci_dir }}
        run: |
          set -euo pipefail
          test -n "${CI_DIR:-}" && test -d "$CI_DIR" || exit 0
          cd "$CI_DIR"
          npx --yes supabase@2.117.0 stop --no-backup || true
