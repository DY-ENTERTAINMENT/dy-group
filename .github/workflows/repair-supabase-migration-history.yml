name: Validate Supabase Migration History

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  validate-history:
    name: Validate reconciled Supabase Production migration history
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate secrets and Production project
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "ulbrmsybdacdhkbkeqwo" ]] || { echo "Production project ref guard failed"; exit 1; }

      - name: Verify normalized migration filenames
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/202608280003_employee_business_card_social_qr.sql
          test -f supabase/migrations/202609150005_scout_daily_work_log_window_and_management_backfill.sql
          test -f supabase/migrations/202608210001_lost_historical_migration_placeholder.sql
          test -f supabase/migrations/202608210002_lost_historical_migration_placeholder.sql
          test ! -e supabase/migrations/202608280001_employee_business_card_social_qr.sql
          test ! -e supabase/migrations/202609150001_scout_daily_work_log_window_and_management_backfill.sql

          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' \
            | sed -nE 's/^([0-9]{12})_.*/\1/p' \
            | sort \
            | uniq -d)"
          test -z "$duplicate_versions" || {
            echo "Duplicate migration version detected"
            exit 1
          }

      - name: Link Supabase Production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Validate Remote migration history
        shell: bash
        run: |
          set -euo pipefail
          migration_list="$(supabase migration list --linked)"
          printf '%s\n' "$migration_list"

          remote_versions="$(printf '%s\n' "$migration_list" | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' | awk -F '|' '
            function normalize(value) {
              gsub(/[\r\`]/, "", value)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              return value
            }
            function is_version(value) {
              return value ~ /^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$/
            }
            {
              if (!header_found && index($0, "|")) {
                for (column = 1; column <= NF; column++) {
                  if (tolower(normalize($column)) == "remote") {
                    remote_column = column
                    header_found = 1
                    next
                  }
                }
              }
              if (header_found && is_version(normalize($remote_column))) print normalize($remote_column)
            }
            END {
              if (!header_found) exit 2
            }
          ' | sort -u)"

          for version in 202608210003 202608280001 202608280002; do
            grep -Fxq "$version" <<< "$remote_versions" || {
              echo "Expected baseline migration history is missing: $version"
              exit 1
            }
          done

          for version in \
            202608210001 202608210002 \
            202608280003 \
            202609010001 202609010002 202609010003 202609010004 202609010005 202609010006 202609010007 \
            202609020008 202609020009 202609020010 202609020011 202609020012 202609020013 202609020014 202609020015 202609020016 202609020017 \
            202609040001 \
            202609070001 202609070002 202609070003 \
            202609080001 202609080002 202609080003 \
            202609090001 202609090002 202609090003 202609090004 \
            202609100001 202609100002 \
            202609150001 202609150002 202609150003 202609150004 202609150005 \
            202609170001 202609210001; do
            grep -Fxq "$version" <<< "$remote_versions" || {
              echo "Expected repaired migration history is missing: $version"
              exit 1
            }
          done

          for version in \
            202608260004 202608260005 202608260006 202608260007 \
            202608270001 202608270002; do
            grep -Fxq "$version" <<< "$remote_versions" || {
              echo "Expected reconciled historical migration is missing: $version"
              exit 1
            }
          done

          if grep -Fxq "202609220001" <<< "$remote_versions"; then
            echo "Phase A migration must remain pending: 202609220001"
            exit 1
          fi

      - name: Validate exact pending migration dry-run
        shell: bash
        run: |
          set -euo pipefail
          migration_list="$(supabase migration list --linked)"
          printf '%s\n' "$migration_list"
          remote_versions="$(printf '%s\n' "$migration_list" | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g' | awk -F '|' '
            function normalize(value) {
              gsub(/[\r\`]/, "", value)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              return value
            }
            function is_version(value) {
              return value ~ /^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$/
            }
            {
              if (!header_found && index($0, "|")) {
                for (column = 1; column <= NF; column++) {
                  if (tolower(normalize($column)) == "remote") {
                    remote_column = column
                    header_found = 1
                    next
                  }
                }
              }
              if (header_found && is_version(normalize($remote_column))) print normalize($remote_column)
            }
            END {
              if (!header_found) exit 2
            }
          ' | sort -u)"
          for version in \
            202608260004 202608260005 202608260006 202608260007 \
            202608270001 202608270002; do
            grep -Fxq "$version" <<< "$remote_versions" || {
              echo "Repaired historical migration is missing: $version"
              exit 1
            }
          done
          if grep -Fxq "202609220001" <<< "$remote_versions"; then
            echo "Phase A migration must remain pending: 202609220001"
            exit 1
          fi

          local_versions="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' \
            | sed -nE 's/^([0-9]{12})_.*/\1/p' \
            | sort -u)"
          local_only_versions="$(comm -23 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions"))"
          remote_only_versions="$(comm -13 <(printf '%s\n' "$local_versions") <(printf '%s\n' "$remote_versions"))"
          test "$local_only_versions" = "202609220001" || {
            echo "Expected only Phase A to be local-only; actual: ${local_only_versions:-<none>}"
            exit 1
          }
          test -z "$remote_only_versions" || {
            echo "Unexpected remote-only migration versions: $remote_only_versions"
            exit 1
          }

          if ! dry_run_output="$(supabase db push --dry-run --linked 2>&1)"; then
            printf '%s\n' "$dry_run_output"
            exit 1
          fi
          printf '%s\n' "$dry_run_output"
          normalized_dry_run_output="$(printf '%s\n' "$dry_run_output" \
            | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g; s/\r$//')"
          pending_migrations="$(printf '%s\n' "$normalized_dry_run_output" \
            | grep -oE '[0-9]{12}_[A-Za-z0-9_.-]+\.sql' \
            | sed -E 's#.*/##' \
            | sort -u || true)"
          expected_pending="202609220001_designer_request_multi_items_phase_a.sql"
          if [[ "$pending_migrations" != "$expected_pending" ]]; then
            echo "Expected exactly one pending migration: $expected_pending"
            echo "Actual pending migrations: ${pending_migrations:-<none>}"
            exit 1
          fi
