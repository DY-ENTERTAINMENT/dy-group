name: Deploy Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      expected_migrations:
        description: "Expected pending migration filenames, one per line"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate pending Supabase Production migrations
    uses: ./.github/workflows/repair-supabase-migration-history.yml
    with:
      expected_migrations: ${{ inputs.expected_migrations }}
    secrets: inherit

  deploy:
    name: Deploy migrations to Supabase Production
    needs: validate-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "ulbrmsybdacdhkbkeqwo" ]] || {
            echo "Production project ref guard failed"
            exit 1
          }

      - name: Link Supabase Production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD"
