name: Deploy Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      expected_migrations:
        description: "Expected pending migration filenames, one per line"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  resolve-expected-migrations:
    name: Resolve expected migration filenames
    runs-on: ubuntu-latest
    outputs:
      expected_migrations: ${{ steps.resolve.outputs.expected_migrations }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve expected migration filenames
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            expected_migrations="$EXPECTED_MIGRATIONS"
          else
            expected_migrations="$(git diff --diff-filter=AM --name-only "$PUSH_BEFORE" "$PUSH_AFTER" -- supabase/migrations \
              | sed -nE 's#^supabase/migrations/([0-9]{12}_[A-Za-z0-9_.-]+\.sql)$#\1#p')"
          fi

          {
            echo 'expected_migrations<<EOF'
            printf '%s\n' "$expected_migrations"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  validate-release:
    name: Validate pending Supabase Production migrations
    needs: resolve-expected-migrations
    uses: ./.github/workflows/repair-supabase-migration-history.yml
    with:
      expected_migrations: ${{ needs.resolve-expected-migrations.outputs.expected_migrations }}
    secrets: inherit

  deploy:
    name: Deploy migrations to Supabase Production
    needs: validate-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "ulbrmsybdacdhkbkeqwo" ]] || {
            echo "Production project ref guard failed"
            exit 1
          }

      - name: Link Supabase Production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD"
