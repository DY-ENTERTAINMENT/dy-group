name: Verify Supabase Zero Pending Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-zero-pending-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production migration history and zero pending migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_VERSION: "202609280001"
      MIGRATION_FILE: "202609280001_management_revenue_creator_count_and_representative_options.sql"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Validate production guard and local migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "ulbrmsybdacdhkbkeqwo" ]] || {
            echo "Production project ref guard failed"
            exit 1
          }
          test -f "supabase/migrations/$MIGRATION_FILE" || {
            echo "Required local migration file is missing."
            exit 1
          }

      - name: Link Supabase Production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List production migration history for audit
        shell: bash
        run: |
          set -euo pipefail
          if ! migration_list_output="$(supabase migration list --linked 2>&1)"; then
            printf '%s\n' "$migration_list_output"
            exit 1
          fi
          printf '%s\n' "$migration_list_output"

      - name: Verify zero pending migrations in dry-run
        shell: bash
        run: |
          set -euo pipefail
          if ! dry_run_output="$(supabase db push --dry-run --linked 2>&1)"; then
            printf '%s\n' "$dry_run_output"
            exit 1
          fi
          printf '%s\n' "$dry_run_output"
          normalized_dry_run_output="$(printf '%s\n' "$dry_run_output" | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g; s/\r$//')"
          if ! printf '%s\n' "$normalized_dry_run_output" | awk '
            BEGIN {
              dry_run_marker = "DRY RUN: migrations will *not* be pushed to the database."
              push_marker = "Would push these migrations:"
              up_to_date_marker = "Remote database is up to date."
              finished_marker = "Finished supabase db" " push."
              state = "before"
            }
            $0 == dry_run_marker {
              dry_run_markers++
              next
            }
            $0 == push_marker {
              push_markers++
              if (state != "before") fail = "unexpected migration plan marker"
              state = "migrations"
              next
            }
            $0 == up_to_date_marker {
              up_to_date_markers++
              next
            }
            state == "migrations" && $0 == "Would seed these files:" {
              state = "ended"
              next
            }
            state == "migrations" && $0 == finished_marker {
              state = "ended"
              next
            }
            state == "migrations" {
              if ($0 ~ /^[[:space:]]*•[[:space:]]*[0-9]{12}_[A-Za-z0-9_.-]+\.sql[[:space:]]*$/) {
                filename = $0
                sub(/^[[:space:]]*•[[:space:]]*/, "", filename)
                sub(/[[:space:]]*$/, "", filename)
                if (seen[filename]++) fail = "duplicate migration in pending plan: " filename
                else print filename
                next
              }
              fail = "unexpected or truncated pending migration plan"
              next
            }
            END {
              if (dry_run_markers != 1) fail = "missing or repeated dry-run marker"
              if (push_markers == 0 && up_to_date_markers == 1 && !fail) exit 0
              if (push_markers != 1) fail = "missing or repeated pending migration marker"
              if (state != "ended") fail = "pending migration plan has no recognized end marker"
              if (fail) {
                print "Unable to parse Supabase CLI dry-run migration plan: " fail > "/dev/stderr"
                exit 1
              }
            }
          ' > "$RUNNER_TEMP/pending_migrations"; then
            echo "Unable to safely determine the dry-run migration plan."
            exit 1
          fi
          if test -s "$RUNNER_TEMP/pending_migrations"; then
            echo "Production has pending migrations:"
            cat "$RUNNER_TEMP/pending_migrations"
            exit 1
          fi
          echo "Production has zero pending migrations."
