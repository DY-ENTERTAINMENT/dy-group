name: Verify Supabase Zero Pending Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-zero-pending-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production migration history and zero pending migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MIGRATION_VERSION: "202609280001"
      MIGRATION_FILE: "202609280001_management_revenue_creator_count_and_representative_options.sql"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Validate production guard and local migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" == "ulbrmsybdacdhkbkeqwo" ]] || {
            echo "Production project ref guard failed"
            exit 1
          }
          test -f "supabase/migrations/$MIGRATION_FILE" || {
            echo "Required local migration file is missing."
            exit 1
          }

      - name: Link Supabase Production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify target migration history is aligned
        shell: bash
        run: |
          set -euo pipefail
          if ! migration_list_output="$(supabase migration list --linked 2>&1)"; then
            printf '%s\n' "$migration_list_output"
            exit 1
          fi
          printf '%s\n' "$migration_list_output"
          normalized_migration_list_output="$(printf '%s\n' "$migration_list_output" | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g; s/\r$//')"
          if ! printf '%s\n' "$normalized_migration_list_output" | grep -Eq "^[[:space:]]*${MIGRATION_VERSION}[[:space:]]*\\|[[:space:]]*${MIGRATION_VERSION}[[:space:]]*\\|"; then
            echo "Local and Remote migration history are not aligned for $MIGRATION_VERSION."
            exit 1
          fi
          echo "Migration history is aligned for $MIGRATION_VERSION."

      - name: Verify zero pending migrations in dry-run
        shell: bash
        run: |
          set -euo pipefail
          if ! dry_run_output="$(supabase db push --dry-run --linked 2>&1)"; then
            printf '%s\n' "$dry_run_output"
            exit 1
          fi
          printf '%s\n' "$dry_run_output"
          normalized_dry_run_output="$(printf '%s\n' "$dry_run_output" | sed -E 's/\x1B\[[0-?]*[ -/]*[@-~]//g; s/\r$//')"
          if printf '%s\n' "$normalized_dry_run_output" | grep -Fqx 'Would push these migrations:'; then
            pending_migrations="$(printf '%s\n' "$normalized_dry_run_output" | sed -nE 's/^[[:space:]]*•[[:space:]]*([0-9]{12}_[A-Za-z0-9_.-]+\.sql)[[:space:]]*$/\1/p')"
            test -n "$pending_migrations" || {
              echo "Unable to parse the dry-run migration plan."
              exit 1
            }
            printf 'Pending migrations:\n%s\n' "$pending_migrations"
            exit 1
          fi
          if ! printf '%s\n' "$normalized_dry_run_output" | grep -Fqx 'Remote database is up to date.'; then
            echo "Unable to safely determine the dry-run migration plan."
            exit 1
          fi
          echo "Production has zero pending migrations."
